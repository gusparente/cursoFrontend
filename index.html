<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura Semántica HTML - Formulario de Contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header: Encabezado principal de la página -->
    <header>
        <!-- Espacio reservado para el encabezado (logo, título, etc.) -->
    </header>

    <!-- Nav: Barra de navegación principal -->
    <nav>
        <!-- Espacio reservado para enlaces de navegación -->
    </nav>

    <!-- Main: Contenido principal de la página -->
    <main>
        <!-- Section: Sección del formulario de contacto -->
        <section>
            <form
                action="https://formspree.io/f/xlgvgboa"
                method="POST"
            >
                <label>
                    Nombre:
                    <input type="text" name="name" required>
                </label>
                
                <label>
                    Correo electrónico:
                    <input type="email" name="email" required>
                </label>
                
                <label>
                    Mensaje:
                    <textarea name="message" rows="5" required></textarea>
                </label>
                
                <button type="submit">Enviar</button>
            </form>
        </section>

        <!-- Section: Otra sección de contenido -->
        <section>
            <!-- Espacio reservado para el contenido de la segunda sección -->
        </section>
    </main>

    <!-- Footer: Pie de página -->
    <footer>
        <!-- Espacio reservado para el pie de página (copyright, enlaces secundarios, etc.) -->
    </footer>
</body>
</html>
